<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Your Profile</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Full Name</ion-label>
        <ion-input [(ngModel)]="userProfile.name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="userProfile.email" readonly></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Phone</ion-label>
        <ion-input [(ngModel)]="userProfile.phone"></ion-input>
      </ion-item>

      <ion-button expand="full" (click)="updateProfile()">Save Changes</ion-button>

      
      <ion-button expand="full" color="secondary" routerLink="/booking-history">
        View Booking History
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
