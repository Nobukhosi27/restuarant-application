<ion-header>
  <ion-toolbar>
    <ion-title>Manage Bookings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let booking of bookings">
      <ion-label>
        <h2>{{ booking.restaurantName }}</h2>
        <p>Date: {{ booking.dateTime.toDate() | date: 'short' }}</p>
        <p>Guests: {{ booking.guests }}</p>
        <p>Status: {{ booking.status }}</p>
      </ion-label>

      <ion-button color="primary" (click)="updateBookingStatus(booking.id, 'confirmed')">
        Confirm
      </ion-button>
      
      <ion-button color="danger" (click)="deleteBooking(booking.id)">
        Delete
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
