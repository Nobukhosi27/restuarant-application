<ion-header>
  <ion-toolbar>
    <ion-title>Restaurant Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">


  <ion-card *ngIf="reviews.length > 0">
    <ion-card-header>
      <ion-card-title>Reviews</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let review of reviews">
          <ion-label>
            <h2>{{ review.restaurantName }}</h2>
            <p>Rating: {{ review.rating }} / 5</p>
            <p>{{ review.review }}</p>
            <p *ngIf="review.adminResponse">Admin Response: {{ review.adminResponse }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  
  <ion-card *ngIf="reviews.length === 0">
    <ion-card-content>
      <p class="text-center">No reviews available for this restaurant yet.</p>
    </ion-card-content>
  </ion-card>

</ion-content>
